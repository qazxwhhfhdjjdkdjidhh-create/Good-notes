<style>
:root{--bg:#e9ebf8;--ink:#12142a;--mute:#5d6280;--glass:rgba(255,255,255,.97);--line:rgba(18,20,42,.14);--a1:#7c3aed;--a2:#0ea5e9;--on:#fff;--card:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07080d;--ink:#eef0ff;--mute:#8b90a8;--glass:rgba(18,20,32,.97);--line:rgba(255,255,255,.13);--a1:#8b5cf6;--a2:#22d3ee;--card:#12141f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#07080d;--ink:#eef0ff;--mute:#8b90a8;--glass:rgba(18,20,32,.97);--line:rgba(255,255,255,.13);--a1:#8b5cf6;--a2:#22d3ee;--card:#12141f;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;touch-action:none;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:"Readex Pro","Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:999px;padding:6px 13px;min-height:38px;cursor:pointer;flex:none;white-space:nowrap}
button:focus-visible,input:focus-visible{outline:2px solid var(--a2);outline-offset:2px}
button:disabled{opacity:.35}
button[aria-pressed="true"]{background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--on)}
.cta{background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--on);font-weight:600;padding:9px 20px}
.ib{width:40px;height:40px;padding:0;display:grid;place-items:center;border-radius:50%}
.ib[aria-pressed="true"]{box-shadow:0 0 16px color-mix(in srgb,var(--a2) 65%,transparent)}
/* library */
#lib{position:absolute;inset:0;overflow-y:auto;touch-action:pan-y;padding:calc(env(safe-area-inset-top,0px) + 28px) 28px 60px;box-sizing:border-box;background:radial-gradient(60% 40% at 85% 0%,color-mix(in srgb,var(--a1) 26%,transparent),transparent),radial-gradient(50% 40% at 5% 10%,color-mix(in srgb,var(--a2) 20%,transparent),transparent)}
#lib header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;max-width:1100px;margin:0 auto 26px}
h1{margin:0;font-size:38px;font-weight:600;letter-spacing:-.5px}
#lcount{margin:4px 0 0;color:var(--mute);font-size:14px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:26px;max-width:1100px;margin:0 auto}
.cw2{position:relative}
.nb{display:flex;flex-direction:column;justify-content:flex-end;gap:4px;width:100%;aspect-ratio:3/4;border-radius:8px 18px 18px 8px;padding:16px 26px 16px 16px;text-align:start;position:relative;overflow:hidden;transition:transform .18s}
.nb:active{transform:scale(.97)}
.cover{background:linear-gradient(150deg,var(--c1),var(--c2));color:#fff;border:0;box-shadow:0 20px 38px -16px var(--c2)}
.cover::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 88%,rgba(0,0,0,.28) 88%,rgba(255,255,255,.18) 91%,rgba(0,0,0,.2) 100%),repeating-linear-gradient(0deg,transparent 0 22px,rgba(255,255,255,.07) 22px 23px);pointer-events:none}
.cover::after{content:"";position:absolute;width:140%;height:60%;top:-30%;left:-20%;background:radial-gradient(closest-side,rgba(255,255,255,.28),transparent);pointer-events:none}
.t{position:relative;font-size:19px;font-weight:600;line-height:1.3;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.m{position:relative;font-size:12px;opacity:.85}
.new{border:1.5px dashed var(--line);align-items:center;justify-content:center;color:var(--mute);background:var(--card)}
.plus{font-size:42px;line-height:1;font-weight:300;background:linear-gradient(135deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.more{position:absolute;top:8px;left:8px;width:34px;min-height:0;height:34px;padding:0;background:rgba(0,0,0,.35);color:#fff;z-index:2}
dialog{border:1px solid var(--line);border-radius:24px;background:var(--glass);color:var(--ink);padding:24px;width:min(420px,92vw);box-sizing:border-box}
dialog::backdrop{background:rgba(5,6,12,.6)}
dialog h2{margin:0 0 14px;font-size:20px;font-weight:600}
#dt{width:100%;box-sizing:border-box;font:inherit;font-size:16px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:14px;padding:11px 14px}
.sws,.seg,.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.sws button{width:36px;height:36px;min-height:0;padding:0;border-radius:50%;border:2px solid var(--line)}
.sws button[aria-pressed="true"]{outline:2px solid var(--a2);outline-offset:2px}
.seg button{border-color:var(--line)}
.danger{color:#ef4444;border-color:var(--line)}
/* editor */
#vp{position:absolute;inset:0;overflow:hidden;touch-action:none;background:radial-gradient(70% 50% at 50% -10%,color-mix(in srgb,var(--a1) 30%,transparent),transparent),radial-gradient(50% 40% at 100% 100%,color-mix(in srgb,var(--a2) 22%,transparent),transparent),var(--bg)}
#vp::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:48px 48px;opacity:.4;pointer-events:none}
.pg{position:absolute;left:0;top:0;width:1000px;transform-origin:0 0;visibility:hidden;background:#fff;pointer-events:none;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 0 70px color-mix(in srgb,var(--a1) 30%,transparent)}
.pg.on{visibility:visible;will-change:transform}
.cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.cv.mk{mix-blend-mode:multiply;opacity:.4}
.selb{position:absolute;background:color-mix(in srgb,var(--a2) 38%,transparent);border-radius:4px;box-shadow:0 0 0 1px var(--a2)}
.glass{background:linear-gradient(var(--glass),var(--glass)) padding-box,linear-gradient(120deg,var(--a1),var(--a2)) border-box;border:1.5px solid transparent;box-shadow:0 10px 34px rgba(0,0,0,.3),0 0 26px color-mix(in srgb,var(--a1) 22%,transparent)}
.pill{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);max-width:calc(100% - 16px);box-sizing:border-box;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;overflow-x:auto;scrollbar-width:none;transition:opacity .15s,transform .22s;z-index:5;direction:rtl;touch-action:pan-x}
.pill::-webkit-scrollbar{display:none}
.pill.off{transform:translate(-50%,-170%);pointer-events:none}
#ed.wr .pill,#ed.wr #pgbar,#ed.wr #rail{opacity:.08;pointer-events:none}
.sep{width:1px;height:22px;background:var(--line);flex:none;margin:0 3px}
.sw{width:26px;height:26px;min-height:0;padding:0;border-radius:50%;border:1px solid var(--line)}
.sw[aria-pressed="true"]{background-image:none;box-shadow:0 0 0 2px var(--glass),0 0 0 4px var(--a2)}
.cw{position:relative;width:26px;height:26px;border-radius:50%;flex:none;background:conic-gradient(#f43f5e,#f59e0b,#22c55e,#06b6d4,#6366f1,#d946ef,#f43f5e)}
.cw.on{box-shadow:0 0 0 2px var(--glass),0 0 0 4px var(--a2)}
#cc{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.dot{width:14px;height:14px;border-radius:50%;flex:none;border:1.5px solid var(--line);transition:width .1s,height .1s}
input[type=range]{width:78px;flex:none;accent-color:var(--a1)}
.handle{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);width:46px;height:46px;border-radius:50%;z-index:5;font-size:20px;padding:0}
.sheet{position:fixed;top:calc(env(safe-area-inset-top,0px) + 66px);left:50%;transform:translateX(-50%);width:min(400px,calc(100% - 24px));box-sizing:border-box;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px;border-radius:22px;z-index:7}
.sheet button{border-radius:14px;border-color:var(--line);text-align:start;white-space:normal}
#pgbar{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:999px;z-index:5;transition:opacity .15s}
#pgbar .ib{width:36px;height:36px}
#pn{width:46px;font:inherit;font-size:15px;text-align:center;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 2px}
#pt{color:var(--mute);font-size:14px;min-width:34px}
#rail{position:fixed;left:8px;top:50%;transform:translateY(-50%);width:28px;height:min(54vh,460px);border-radius:14px;background:var(--glass);border:1px solid var(--line);opacity:.4;transition:opacity .2s;z-index:4;touch-action:none}
#rail.act{opacity:1}
#thumb{position:absolute;left:5px;width:16px;height:30px;border-radius:8px;background:linear-gradient(180deg,var(--a1),var(--a2));box-shadow:0 0 14px color-mix(in srgb,var(--a2) 70%,transparent);pointer-events:none}
#bub{position:fixed;left:46px;z-index:6;padding:6px 14px;border-radius:999px;font-size:15px;font-weight:600;pointer-events:none}
#chip{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:48px;z-index:5;background:var(--glass);border:1px solid var(--line)}
.hud{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);left:50%;transform:translateX(-50%);width:min(640px,calc(100% - 24px));box-sizing:border-box;max-height:42vh;overflow-y:auto;padding:14px 18px;border-radius:22px;z-index:6;touch-action:pan-y;-webkit-user-select:text;user-select:text}
.hh{display:flex;gap:6px;align-items:center}.sp{flex:1}
#hOrig{margin:10px 0 6px;font-size:13px;color:var(--mute);direction:auto;text-align:start}
#hOut{margin:0;font-size:19px;line-height:1.75;direction:auto;text-align:start;overflow-wrap:anywhere}
#toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}
</style>

    LIB.push({id:id,title:'دفتري',ci:0,n:o.pages.length,u:Date.now(),pdf:o.pages.some(function(p){return p.pdf;})});await kvSet('nb:'+id,JSON.stringify(o));await kvSet('lib',JSON.stringify(LIB));}}
 }catch(e){}
 var last=await kvGet('last');
 if(last&&LIB.some(function(m){return m.id===last;})){await openNb(last);}
 else{renderLib();$('lib').hidden=false;}
})();
})();
</script>
